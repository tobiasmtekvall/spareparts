# Paste into https://api.slack.com/apps → Create New App → From an app manifest
display_information:
  name: Spare Parts
  description: Look up and book spare parts from the Jönköping inventory
  background_color: "#161a20"
features:
  bot_user:
    display_name: Spare Parts
    always_online: true
  slash_commands:
    - command: /parts
      description: Search spare parts, take or add stock
      usage_hint: "[search] | take <pn> [qty] | add <pn> [qty] | low | help"
      should_escape: false
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - chat:write.public
      - app_mentions:read
      - im:history
      - im:read
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
